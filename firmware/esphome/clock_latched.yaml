substitutions:
  name: wifi-clock
  friendly_name: WiFi Clock

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

time:
  - platform: homeassistant
    id: time_id

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

latched_display:
  id: panel
  le_pin: GPIO22
  clk_pin: GPIO21
  sdi_pin: GPIO19
  d1_pin: GPIO18
  d0_pin: GPIO5
  en_pin: GPIO4
  time_id: time_id
  twelve_hour: false

light:
  - platform: latched_display
    id: clock_light
    latched_display_id: panel
    name: ${friendly_name}
    default: true
    restore_mode: ALWAYS_ON
